<script>

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive";

let accessToken = null;
let tokenClient = null;


/* PAGE LOAD */

window.addEventListener("load", function(){

  document.getElementById("clientId").value =
    localStorage.getItem("jarvisClientId") || "";

  document.getElementById("folderId").value =
    localStorage.getItem("jarvisFolderId") || "";

});


/* STATUS */

function status(id,msg){

  document.getElementById(id).textContent = msg;

}


/* SAVE CLIENT ID */

function saveClientId(){

  const clientId =
    document.getElementById("clientId")
    .value.trim();

  if(!clientId){

    status(
      "loginStatus",
      "à¤ªà¤¹à¤²à¥‡ Client ID à¤¡à¤¾à¤²à¥‡à¤‚à¥¤"
    );

    return;
  }

  localStorage.setItem(
    "jarvisClientId",
    clientId
  );

  status(
    "loginStatus",
    "Client ID save à¤¹à¥‹ à¤—à¤¯à¤¾ âœ…"
  );

}


/* SAVE FOLDER ID */

function saveFolderId(){

  const folderId =
    document.getElementById("folderId")
    .value.trim();

  if(!folderId){

    status(
      "loginStatus",
      "à¤ªà¤¹à¤²à¥‡ Folder ID à¤¡à¤¾à¤²à¥‡à¤‚à¥¤"

  localStorage.setItem(

/* GOOGLE LOGIN */

function googleLogin(){

  const clientId =
    document.getElementById("clientId")
    .value.trim();

  if(!clientId){

    status(
      "loginStatus",
      "à¤ªà¤¹à¤²à¥‡ Google OAuth Client ID à¤¡à¤¾à¤²à¥‡à¤‚à¥¤"
    );

    return;
  }

  if(!window.google){

    status(
      "loginStatus",
      "Google Login load à¤¹à¥‹ à¤°à¤¹à¤¾ à¤¹à¥ˆà¥¤"
    );

    return;
  }

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:clientId,

      scope:DRIVE_SCOPE,

      callback:function(response){

        if(response.error){

          status(
            "loginStatus",
            "Google Login Error: "
            + response.error
          );

          return;
        }

        accessToken =
          response.access_token;

        status(
          "loginStatus",
          "Google Login à¤¸à¤«à¤² âœ…"
        );

        listFiles();

      }

    });


  tokenClient.requestAccessToken({
    prompt:"consent"
  });

}


/* DRIVE REQUEST */

async function driveRequest(
  url,
  options={}
){

  if(!accessToken){

    throw new Error(
      "à¤ªà¤¹à¤²à¥‡ Google Login à¤•à¤°à¥‡à¤‚à¥¤"
    );

  }

  options.headers =
    Object.assign(

      {
        "Authorization":
        "Bearer " + accessToken
      },

      options.headers || {}

    );


  const response =
    await fetch(url,options);


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return response;

}


/* FOLDER */

function folder(){

  return document
    .getElementById("folderId")
    .value.trim();

}


/* DRIVE LINK */

function driveLink(id){

  return "https://drive.google.com/file/d/"
    + encodeURIComponent(id)
    + "/view";

}


/* FILE HTML */

function fileHtml(file){

  return `

  <div class="file">

    <b>
      ${escapeHtml(file.name)}
    </b>

    <br>

    <span class="small">
      ${escapeHtml(file.mimeType)}
    </span>

    <br>

    <a
      href="${driveLink(file.id)}"
      target="_blank"
      rel="noopener"
    >
      ðŸ“‚ Drive à¤®à¥‡à¤‚ à¤–à¥‹à¤²à¥‡à¤‚
    </a>

  </div>

  `;

}


/* LIST FILES */

async function listFiles(){

  try{

    const folderId =
      folder();


    if(!folderId){

      document
        .getElementById("fileList")
        .textContent =
        "à¤ªà¤¹à¤²à¥‡ JARVIS_DATA Folder ID à¤¡à¤¾à¤²à¥‡à¤‚à¥¤";

      return;
    }


    const query =
      "'" +
      folderId +
      "' in parents and trashed=false";


    const url =
      "https://www.googleapis.com/drive/v3/files?"
      +
      new URLSearchParams({

        q:query,

        fields:
        "files(id,name,mimeType,modifiedTime)",

        pageSize:"100",

        orderBy:"modifiedTime desc"

      });


    const response =
      await driveRequest(url);


    const data =
      await response.json();


    const list =
      document.getElementById("fileList");


    if(
      !data.files ||
      data.files.length === 0
    ){

      list.innerHTML =
        "<p>JARVIS_DATA folder à¤–à¤¾à¤²à¥€ à¤¹à¥ˆà¥¤</p>";

      return;
    }


    list.innerHTML =
      data.files
      .map(fileHtml)
      .join("");

  }

  catch(error){

    document
      .getElementById("fileList")
      .textContent =
      "Error: " + error.message;

  }

}


/* SEARCH FILE */

async function searchFiles(){

  const term =
    document
    .getElementById("searchText")
    .value
    .trim();


  const folderId =
    folder();


  if(!term){

    status(
      "searchStatus",
      "à¤ªà¤¹à¤²à¥‡ file à¤•à¤¾ à¤¨à¤¾à¤® à¤²à¤¿à¤–à¥‡à¤‚à¥¤"
    );

    return;
  }


  if(!folderId){

    status(
      "searchStatus",
      "à¤ªà¤¹à¤²à¥‡ Folder ID à¤¡à¤¾à¤²à¥‡à¤‚à¥¤"
    );

    return;
  }


  if(!accessToken){

    status(
      "searchStatus",
      "à¤ªà¤¹à¤²à¥‡ Google Login à¤•à¤°à¥‡à¤‚à¥¤"
    );

    return;
  }


  try{

    const safeTerm =
      term.replace(/'/g,"\\'");


    const query =
      "'" +
      folderId +
      "' in parents and trashed=false and name contains '" +
      safeTerm +
      "'";


    const url =
      "https://www.googleapis.com/drive/v3/files?"
      +
      new URLSearchParams({

        q:query,

        fields:
        "files(id,name,mimeType)",

        pageSize:"100"

      });


    const response =
      await driveRequest(url);


    const data =
      await response.json();


    const files =
      data.files || [];


    status(
      "searchStatus",

      files.length
      ? "âœ… " + files.length + " file à¤®à¤¿à¤²à¥€à¥¤"
      : "âŒ à¤•à¥‹à¤ˆ file à¤¨à¤¹à¥€à¤‚ à¤®à¤¿à¤²à¥€à¥¤"

    );


    document
      .getElementById("searchResults")
      .innerHTML =
      files.map(fileHtml).join("");


  }

  catch(error){

    status(
      "searchStatus",
      "Search Error: " +
      error.message
    );

  }

}


/* UPLOAD */

async function uploadFile(){

  const file =
    document
    .getElementById("fileUpload")
    .files[0];


  const folderId =
    folder();


  if(!file){

    status(
      "uploadStatus",
      "à¤ªà¤¹à¤²à¥‡ à¤•à¥‹à¤ˆ file à¤šà¥à¤¨à¥‡à¤‚à¥¤"
    );

    return;
  }


  if(!folderId){

    status(
      "uploadStatus",
      "à¤ªà¤¹à¤²à¥‡ Folder ID à¤¡à¤¾à¤²à¥‡à¤‚à¥¤"
    );

    return;
  }


  try{

    const boundary =
      "jarvis_" +
      Date.now();


    const metadata = {

      name:file.name,

      parents:[folderId]

    };


    const body =
      new Blob([

        "--" +
        boundary +
        "\r\n",

        "Content-Type: application/json; charset=UTF-8\r\n\r\n",

        JSON.stringify(metadata),

        "\r\n--" +
        boundary +
        "\r\n",

        "Content-Type: " +
        (
          file.type ||
          "application/octet-stream"
        ) +
        "\r\n\r\n",

        file,

        "\r\n--" +
        boundary +
        "--"

      ]);


    await driveRequest(

      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",

      {

        method:"POST",

        headers:{

          "Content-Type":
          "multipart/related; boundary=" +
          boundary

        },

        body:body

      }

    );


    status(
      "uploadStatus",
      "File successfully upload à¤¹à¥‹ à¤—à¤ˆ âœ…"
    );


    document
      .getElementById("fileUpload")
      .value="";


    listFiles();

  }

  catch(error){

    status(
      "uploadStatus",
      "Upload Error: " +
      error.message
    );

  }

}

/* VOICE JARVIS */
function startVoiceJARVIS(){
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    status(
      "voiceStatus",
      "Chrome à¤®à¥‡à¤‚ Voice Search à¤šà¤²à¤¾à¤à¤à¥¤"
    );
    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "hi-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  status(
    "voiceStatus",
    "ðŸŽ¤ à¤¸à¥à¤¨ à¤°à¤¹à¤¾ à¤¹à¥‚à¤... File à¤¯à¤¾ command à¤¬à¥‹à¤²à¤¿à¤à¥¤"
  );

  recognition.start();

  recognition.onresult =
  function(event){

    const text =
      event
      .results[0][0]
      .transcript
      .trim();

    status(
      "voiceStatus",
      "à¤†à¤ªà¤¨à¥‡ à¤•à¤¹à¤¾: " + text
    );

    /*
      VOICE COMMAND EXAMPLES

      "à¤¸à¥à¤•à¥à¤°à¥€à¤¨à¤¶à¥‰à¤Ÿ à¤¢à¥‚à¤‚à¤¢à¥‹"
      "à¤¸à¥à¤•à¥à¤°à¥€à¤¨à¤¶à¥‰à¤Ÿ à¤¨à¤¾à¤® à¤•à¥€ à¤«à¤¾à¤‡à¤² à¤–à¥‹à¤œà¥‹"
      "Screenshot à¤µà¤¾à¤²à¥€ file à¤–à¥‹à¤²à¥‹"
      "WhatsApp à¤µà¤¾à¤²à¥€ à¤«à¥‹à¤Ÿà¥‹ à¤–à¥‹à¤²à¥‹"
      "à¤†à¤œ à¤µà¤¾à¤²à¥€ à¤«à¥‹à¤Ÿà¥‹ à¤–à¥‹à¤œà¥‹"
      "à¤†à¤œ à¤•à¥€ à¤«à¤¾à¤‡à¤²à¥‡à¤‚ à¤¦à¤¿à¤–à¤¾à¤“"
      "Jarvis à¤¸à¥à¤•à¥à¤°à¥€à¤¨à¤¶à¥‰à¤Ÿ à¤–à¥‹à¤²à¥‹"
    */

    let command = text
      .replace(/^à¤œà¤¾à¤°à¥à¤µà¤¿à¤¸[\s,]*/i, "")
      .replace(/^jarvis[\s,]*/i, "")
      .trim();

    const lower = command.toLowerCase();

    const todayCommand =
      /à¤†à¤œ|today/i.test(command);

    const imageCommand =
      /à¤«à¥‹à¤Ÿà¥‹|photo|image|à¤‡à¤®à¥‡à¤œ|à¤¤à¤¸à¥à¤µà¥€à¤°|picture|à¤šà¤¿à¤¤à¥à¤°/i.test(command);

    const openCommand =
      /à¤–à¥‹à¤²à¥‹|à¤–à¥‹à¤²à¤¨à¤¾|à¤–à¥‹à¤²à¥‡à¤‚|open|à¤¦à¤¿à¤–à¤¾à¤“|à¤¦à¤¿à¤–à¤¾à¤¨à¤¾|show/i.test(command);

    /*
      Search words à¤¹à¤Ÿà¤¾à¤à¤à¥¤
      "à¤¸à¥à¤•à¥à¤°à¥€à¤¨à¤¶à¥‰à¤Ÿ à¤¨à¤¾à¤® à¤•à¥€ à¤«à¤¾à¤‡à¤² à¤–à¥‹à¤œà¥‹"
      -> "à¤¸à¥à¤•à¥à¤°à¥€à¤¨à¤¶à¥‰à¤Ÿ"
    */
    let term = command
      .replace(
        /à¤«à¤¾à¤‡à¤²|à¤«à¤¼à¤¾à¤‡à¤²|file|à¤–à¥‹à¤²à¥‹|à¤–à¥‹à¤²à¤¨à¤¾|à¤–à¥‹à¤²à¥‡à¤‚|open|à¤¦à¤¿à¤–à¤¾à¤“|à¤¦à¤¿à¤–à¤¾à¤¨à¤¾|show|à¤¢à¥‚à¤‚à¤¢à¥‹|à¤¢à¥‚à¤à¤¢à¥‹|à¤¢à¥‚à¤‚à¤¢à¤¨à¤¾|à¤¢à¥‚à¤à¤¢à¤¨à¤¾|à¤–à¥‹à¤œà¥‹|à¤–à¥‹à¤œà¤¨à¤¾|à¤–à¥‹à¤œà¥‡à¤‚|à¤¸à¤°à¥à¤š|search|à¤µà¤¾à¤²à¥€|à¤µà¤¾à¤²à¤¾|à¤µà¤¾à¤²à¥‡|à¤µà¤¾à¤²à¥€\s*à¤•à¥€|à¤¨à¤¾à¤®|à¤•à¥€|à¤•à¤¾|à¤•à¥‡|à¤¹à¥ˆ|à¤¹à¥ˆà¤‚|à¤•à¥ƒà¤ªà¤¯à¤¾|à¤šà¤¾à¤¹à¤¿à¤|à¤®à¥à¤à¥‡|à¤à¤•|à¤¦à¥‡à¤‚|à¤¦à¥‹|à¤•à¤°à¥‹|à¤•à¤°à¤¨à¤¾|à¤•à¤°à¥‡à¤‚/gi,
        " "
      )
      .replace(
        /à¤¸à¥à¤•à¥à¤°à¥€à¤¨\s*à¤¶à¥‰à¤Ÿ/gi,
        "à¤¸à¥à¤•à¥à¤°à¥€à¤¨à¤¶à¥‰à¤Ÿ"
      )
      .replace(/\s+/g," ")
      .trim();

    /*
      à¤…à¤—à¤° command à¤¸à¤¿à¤°à¥à¤« "à¤†à¤œ à¤•à¥€ à¤«à¥‹à¤Ÿà¥‹" à¤¹à¥ˆ,
      à¤¤à¥‹ "à¤†à¤œ" à¤”à¤° "à¤«à¥‹à¤Ÿà¥‹" search term à¤¨à¤¹à¥€à¤‚ à¤¹à¥‹à¤‚à¤—à¥‡à¥¤
    */
    if(todayCommand){
      term = term
        .replace(/à¤†à¤œ|today/gi," ")
        .replace(
          /à¤«à¥‹à¤Ÿà¥‹|photo|image|à¤‡à¤®à¥‡à¤œ|à¤¤à¤¸à¥à¤µà¥€à¤°|picture|à¤šà¤¿à¤¤à¥à¤°/gi,

    if(!term && !todayCommand){

      );
      return;
    }

    document
      .getElementById("searchText")
      .value = term;

    voiceSearch(

  };

  recognition.onerror =

}


/* VOICE SEARCH */
async function voiceSearch(
  term,
  options={}
){
  const folderId =
    folder();

  if(!folderId){
    status(
      "voiceStatus",
      "à¤ªà¤¹à¤²à¥‡ Folder ID à¤¡à¤¾à¤²à¥‡à¤‚à¥¤"
    );
    return;
  }

  if(!accessToken){
    status(
      "voiceStatus",
      "à¤ªà¤¹à¤²à¥‡ Google Login à¤•à¤°à¥‡à¤‚à¥¤"
    );
    return;
  }

  try{

    /*
      Voice commands à¤•à¥‡ à¤²à¤¿à¤ à¤ªà¤¹à¤²à¥‡ folder à¤•à¥€ files
      à¤²à¤¾à¤¤à¥‡ à¤¹à¥ˆà¤‚ à¤¤à¤¾à¤•à¤¿ "à¤†à¤œ à¤µà¤¾à¤²à¥€ à¤«à¥‹à¤Ÿà¥‹" à¤œà¥ˆà¤¸à¥‡ commands à¤­à¥€ à¤šà¤²à¥‡à¤‚à¥¤
    */
    let query =
      "'" +
      folderId +
      "' in parents and trashed=false";

    if(term){
      const safeTerm =
        term.replace(/'/g,"\\'");

      query +=
        " and name contains '" +
        safeTerm +
        "'";
    }

    const url =
      "https://www.googleapis.com/drive/v3/files?"
      +
      new URLSearchParams({
        q:query,
        fields:
          "files(id,name,mimeType,modifiedTime)",
        pageSize:"100",
        orderBy:"modifiedTime desc"
      });

    const response =
      await driveRequest(url);

    const data =
      await response.json();

    let files =
      data.files || [];

    /*
      "à¤†à¤œ à¤µà¤¾à¤²à¥€ à¤«à¥‹à¤Ÿà¥‹" / "à¤†à¤œ à¤•à¥€ à¤«à¥‹à¤Ÿà¥‹"
      à¤•à¥‡ à¤²à¤¿à¤ à¤†à¤œ à¤•à¥€ modified files à¤¹à¥€ à¤°à¤–à¥‡à¤‚à¥¤
    */
    if(options.today){

      const now = new Date();

      const startOfToday =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );

      files =
        files.filter(function(file){

          if(!file.modifiedTime){
            return false;
          }

          const modified =
            new Date(file.modifiedTime);

          return modified >= startOfToday;
        });
    }

    /*
      "WhatsApp à¤µà¤¾à¤²à¥€ à¤«à¥‹à¤Ÿà¥‹"
      à¤œà¥ˆà¤¸à¥‡ command à¤®à¥‡à¤‚ à¤¸à¤¿à¤°à¥à¤« image files à¤°à¤–à¥‡à¤‚à¥¤
    */
    if(options.imageOnly){

      files =
        files.filter(function(file){

          return String(
            file.mimeType || ""
          ).startsWith("image/");
        });
    }

    if(!files.length){

      let message =
        "âŒ à¤•à¥‹à¤ˆ file à¤¨à¤¹à¥€à¤‚ à¤®à¤¿à¤²à¥€à¥¤";

      if(term){
        message =
          "âŒ '" +
          term +
          "' à¤¨à¤¾à¤® à¤•à¥€ file à¤¨à¤¹à¥€à¤‚ à¤®à¤¿à¤²à¥€à¥¤";
      }else if(options.today){
        message =
          "âŒ à¤†à¤œ à¤•à¥€ à¤•à¥‹à¤ˆ file à¤¨à¤¹à¥€à¤‚ à¤®à¤¿à¤²à¥€à¥¤";
      }

      status(
        "voiceStatus",
        message
      );

      document
        .getElementById("searchResults")
        .innerHTML = "";

      return;
    }

    status(
      "voiceStatus",
      "âœ… " +
      files.length +
      " file à¤®à¤¿à¤²à¥€à¥¤"
    );

    document
      .getElementById("searchResults")
      .innerHTML =
      files.map(fileHtml).join("");

    /*
      à¤…à¤—à¤° à¤¬à¥‹à¤²à¤¨à¥‡ à¤®à¥‡à¤‚ "à¤–à¥‹à¤²à¥‹ / open" à¤•à¤¹à¤¾ à¤¹à¥ˆ
      à¤”à¤° à¤¸à¤¿à¤°à¥à¤« 1 file à¤®à¤¿à¤²à¥€ à¤¹à¥ˆ à¤¤à¥‹ à¤‰à¤¸à¥‡ à¤–à¥‹à¤²à¥‡à¤‚à¥¤
    */
    if(
      options.autoOpen &&
      files.length === 1
    ){
      window.open(
        driveLink(files[0].id),
        "_blank"
      );
    }

  }
  catch(error){

    status(
      "voiceStatus",
      "Voice Search Error: " +
      error.message
    );
  }
}

/* HTML SECURITY */

function escapeHtml(text){

  return String(text).replace(

    /[&<>"']/g,

    function(character){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[character];

    }

  );

}
