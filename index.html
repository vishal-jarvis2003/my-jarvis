<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My JARVIS</title>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:900px;
  margin:auto;
  padding:20px;
  background:#f4f7fb;
  color:#172033;
}

h1{

}

.card{
  background:white;
  padding:20px;

  border-radius:14px;

}

input,textarea{

}

button{
  padding:11px 16px;

  border-radius:8px;

}

}

}

.file{
  padding:12px 0;

}

.small{

}

a{
  color:#1769e0;
}

  text-align:center;
  padding:10px;
}

#voiceButton{

}

}

</style>

</head>

<body>

<h1>🤖 My JARVIS</h1>


<!-- =========================
     GOOGLE LOGIN
========================= -->

<div class="card">

<h2>1. 🔐 Google Login</h2>

<input

>

Save Client ID
</button>

Google Login
</button>

<!-- =========================
     JARVIS DATA
========================= -->

<h2>2. 📁 JARVIS_DATA</h2>

  id="folderId"

>

Save Folder ID

>

JARVIS_DATA में Upload करें
</button>

<div id="uploadStatus" class="status"></div>

</div>

     NOTES
========================= -->

<h2>5. 📝 JARVIS Notes</h2>

  rows="6"

></textarea>

<button onclick="saveNote()">
Note Drive में Save करें
</button>

🎤 Voice से Note
</button>

🔎 Notes खोजें
</button>

<!-- =========================
     VOICE JARVIS
========================= -->

<h2>6. 🎤 Voice JARVIS</h2>

<div class="voiceBox">

<button
  id="voiceButton"
  onclick="startVoiceJARVIS()"
>
🎤 JARVIS से बोलें
</button>

</div>

<div id="voiceStatus" class="status"></div>

<div
  id="lastCommand"
  class="commandBox"
  style="display:none"
></div>

</div>


<!-- =========================
     JARVIS SPEAK
========================= -->

<div class="card">

<h2>7. 🔊 JARVIS Voice</h2>

<button onclick="jarvisSpeak(
'नमस्ते! मैं JARVIS हूँ। मैं आपकी मदद के लिए तैयार हूँ।'
)">
🔊 JARVIS को बोलाएँ
</button>

<button
  class="stop"
  onclick="stopSpeaking()"
>
🔇 आवाज बंद करें
</button>

</div>


<script src="https://accounts.google.com/gsi/client" async defer></script>


<script>

/* =====================================================
   GLOBAL
===================================================== */

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive";

let accessToken = null;

let tokenClient = null;

let recognition = null;


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener("load",function(){

  document.getElementById("clientId").value =
    localStorage.getItem("jarvisClientId") || "";

  document.getElementById("folderId").value =
    localStorage.getItem("jarvisFolderId") || "";

});


/* =====================================================
   STATUS
===================================================== */

function status(id,msg){

  const el =
    document.getElementById(id);

  if(el){
    el.textContent = msg;
  }

}


/* =====================================================
   JARVIS SPEAK
===================================================== */

function jarvisSpeak(text){

  if(!("speechSynthesis" in window)){

    console.log(
      "Text to Speech supported नहीं है"
    );

    return;
  }

  window.speechSynthesis.cancel();

  const message =
    new SpeechSynthesisUtterance(
      String(text)
    );

  message.lang = "hi-IN";

  message.rate = 0.95;

  message.pitch = 1;

  message.volume = 1;

  window.speechSynthesis.speak(
    message
  );

}


/* =====================================================
   STOP SPEAKING
===================================================== */

function stopSpeaking(){

  if("speechSynthesis" in window){

    window.speechSynthesis.cancel();

  }

}


/* =====================================================
   SAVE CLIENT ID
===================================================== */

function saveClientId(){

  const clientId =
    document
      .getElementById("clientId")
      .value
      .trim();

  if(!clientId){

    status(
      "loginStatus",
      "पहले Client ID डालें।"
    );

    return;
  }

  localStorage.setItem(
    "jarvisClientId",
    clientId
  );

  status(
    "loginStatus",
    "Client ID save हो गया ✅"
  );

}


/* =====================================================
   SAVE FOLDER ID
===================================================== */

function saveFolderId(){

  const folderId =
    document
      .getElementById("folderId")
      .value
      .trim();

  if(!folderId){

    status(
      "loginStatus",
      "पहले Folder ID डालें।"
    );

    return;
  }

  localStorage.setItem(
    "jarvisFolderId",
    folderId
  );

  status(
    "loginStatus",
    "JARVIS_DATA Folder ID save हो गई ✅"
  );

}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

function googleLogin(){

  const clientId =
    document
      .getElementById("clientId")
      .value
      .trim();

  if(!clientId){

    status(
      "loginStatus",
      "पहले Google OAuth Client ID डालें।"
    );

    return;
  }

  if(
    !window.google ||
    !google.accounts ||
    !google.accounts.oauth2
  ){

    status(
      "loginStatus",
      "Google Login load हो रहा है। 2-3 सेकंड बाद फिर दबाएँ।"
    );

    return;
  }


  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:clientId,

      scope:DRIVE_SCOPE,

      callback:function(response){

        if(response.error){

          status(
            "loginStatus",
            "Google Login Error: " +
            response.error
          );

          jarvisSpeak(
            "Google Login में समस्या आई है।"
          );

          return;
        }


        accessToken =
          response.access_token;


        status(
          "loginStatus",
          "Google Login सफल ✅"
        );


        jarvisSpeak(
          "Google Login सफल हो गया।"
        );


        listFiles();

      }

    });


  tokenClient.requestAccessToken({

    prompt:"consent"

  });

}


/* =====================================================
   DRIVE REQUEST
===================================================== */

async function driveRequest(
  url,
  options={}
){

  if(!accessToken){

    throw new Error(
      "पहले Google Login करें।"
    );

  }


  options.headers =
    Object.assign(

      {
        "Authorization":
        "Bearer " + accessToken
      },

      options.headers || {}

    );


  const response =
    await fetch(
      url,
      options
    );


  if(response.status === 401){

    accessToken = null;

    throw new Error(
      "Google Login session खत्म हो गई। फिर से Google Login करें।"
    );

  }


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  return response;

}


/* =====================================================
   FOLDER
===================================================== */

function folder(){

  return document
    .getElementById("folderId")
    .value
    .trim();

}


/* =====================================================
   DRIVE LINK
===================================================== */

function driveLink(id){

  return (
    "https://drive.google.com/file/d/" +
    encodeURIComponent(id) +
    "/view"
  );

}


/* =====================================================
   FILE TYPE
===================================================== */

function getFileType(file){

  const mime =
    String(
      file.mimeType || ""
    ).toLowerCase();

  const name =
    String(
      file.name || ""
    ).toLowerCase();


  if(
    mime ===
    "application/vnd.google-apps.folder"
  ){

    return "Folder";

  }


  if(
    mime.includes("pdf") ||
    name.endsWith(".pdf")
  ){

    return "PDF";

  }


  if(
    mime.includes("word") ||
    name.endsWith(".doc") ||
    name.endsWith(".docx")
  ){

    return "Word";

  }


  if(
    mime.startsWith("image/")
  ){

    return "Photo";

  }


  if(
    mime.startsWith("video/")
  ){

    return "Video";

  }


  if(
    mime.includes("spreadsheet") ||
    name.endsWith(".xls") ||
    name.endsWith(".xlsx")
  ){

    return "Excel";

  }


  if(
    mime.includes("text") ||
    name.endsWith(".txt")
  ){

    return "Text";

  }


  return "File";

}


/* =====================================================
   FILE HTML
===================================================== */

function fileHtml(file){

  const type =
    getFileType(file);


  const date =
    file.modifiedTime
      ? new Date(
          file.modifiedTime
        ).toLocaleString("hi-IN")
      : "";


  return `

  <div class="file">

    <b>
      ${escapeHtml(file.name)}
    </b>

    <br>

    <span class="small">
      📌 Type: ${escapeHtml(type)}
    </span>

    ${
      date
      ?
      `<br>
       <span class="small">
       🕒 ${escapeHtml(date)}
       </span>`
      :
      ""
    }

    <br>

    <span class="small">
      ${escapeHtml(
        file.mimeType || ""
      )}
    </span>

    <br>

    <a
      href="${driveLink(file.id)}"
      target="_blank"
      rel="noopener"
    >
      📂 Drive में खोलें
    </a>

  </div>

  `;

}


/* =====================================================
   GET FOLDER FILES
===================================================== */

async function getFolderFiles(){

  const folderId =
    folder();


  const query =
    "'" +
    folderId +
    "' in parents and trashed=false";


  const url =
    "https://www.googleapis.com/drive/v3/files?" +
    new URLSearchParams({

      q:query,

      fields:
      "files(id,name,mimeType,modifiedTime)",

      pageSize:"100",

      orderBy:
      "modifiedTime desc"

    });


  const response =
    await driveRequest(url);


  const data =
    await response.json();


  return data.files || [];

}


/* =====================================================
   LIST FILES
===================================================== */

async function listFiles(){

  try{

    const folderId =
      folder();


    if(!folderId){

      document
        .getElementById("fileList")
        .textContent =
        "पहले JARVIS_DATA Folder ID डालें।";

      return;

    }


    const files =
      await getFolderFiles();


    const list =
      document
        .getElementById("fileList");


    if(!files.length){

      list.innerHTML =
        "<p>JARVIS_DATA folder खाली है।</p>";

      return;

    }


    list.innerHTML =
      files
        .map(fileHtml)
        .join("");

  }


  catch(error){

    document
      .getElementById("fileList")
      .textContent =
      "Error: " +
      error.message;

  }

}


/* =====================================================
   HINDI → ENGLISH
===================================================== */

const hindiEnglishMap = {

  "विशाल":"vishal",

  "स्क्रीनशॉट":"screenshot",

  "स्क्रीन शॉट":"screenshot",

  "फोटो":"photo",

  "तस्वीर":"photo",

  "चित्र":"photo",

  "इमेज":"image",

  "वीडियो":"video",

  "वर्ड":"word",

  "डॉक्यूमेंट":"document",

  "पीडीएफ":"pdf",

  "एक्सेल":"excel",

  "फाइल":"file",

  "फाइलें":"files",

  "नोट":"note",

  "आज":"today"

};


function convertHindiToEnglish(text){

  let result =
    String(text || "");


  Object.keys(
    hindiEnglishMap
  )
  .sort(
    (a,b)=>
    b.length-a.length
  )
  .forEach(function(key){

    result =
      result.replace(

        new RegExp(
          key,
          "gi"
        ),

        " " +
        hindiEnglishMap[key] +
        " "

      );

  });


  return result
    .replace(/\s+/g," ")
    .trim();

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeText(text){

  return String(text || "")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[“”‘’]/g,"'")
    .replace(/\s+/g," ")
    .trim();

}


/* =====================================================
   SEARCH FILES
===================================================== */

async function searchFiles(){

  const raw =
    document
      .getElementById("searchText")
      .value
      .trim();


  if(!raw){

    status(
      "searchStatus",
      "पहले file का नाम लिखें।"
    );

    return;

  }


  await performSearch(
    raw,
    false
  );

}


/* =====================================================
   PERFORM SEARCH
===================================================== */

async function performSearch(
  raw,
  voiceMode=false
){

  const folderId =
    folder();


  if(!folderId){

    status(
      voiceMode
      ? "voiceStatus"
      : "searchStatus",

      "पहले Folder ID डालें।"
    );

    return;

  }


  if(!accessToken){

    status(
      voiceMode
      ? "voiceStatus"
      : "searchStatus",

      "पहले Google Login करें।"
    );

    return;

  }


  try{

    let files =
      await getFolderFiles();


    const original =
      normalizeText(raw);


    const converted =
      normalizeText(
        convertHindiToEnglish(
          original
        )
      );


    let searchTerm =
      converted
        .replace(
          /\bfile\b/gi,
          ""
        )
        .trim();


    if(searchTerm){

      files =
        files.filter(
          function(file){

            const name =
              normalizeText(
                file.name
              );


            const convertedName =
              normalizeText(
                convertHindiToEnglish(
                  file.name
                )
              );


            return (
              name.includes(searchTerm) ||
              convertedName.includes(searchTerm) ||
              name.includes(original)
            );

          }
        );

    }


    /* PHOTO */

    if(
      /\b(photo|image)\b/i.test(
        converted
      )
    ){

      files =
        files.filter(
          f =>
          String(
            f.mimeType || ""
          )
          .startsWith("image/")
        );

    }


    /* VIDEO */

    if(
      /\bvideo\b/i.test(
        converted
      )
    ){

      files =
        files.filter(
          f =>
          String(
            f.mimeType || ""
          )
          .startsWith("video/")
        );

    }


    /* WORD */

    if(
      /\bword|document\b/i.test(
        converted
      )
    ){

      files =
        files.filter(
          f =>
          String(
            f.mimeType || ""
          ).includes("word")
          ||
          /\.(doc|docx)$/i.test(
            f.name
          )
        );

    }


    /* PDF */

    if(
      /\bpdf\b/i.test(
        converted
      )
    ){

      files =
        files.filter(
          f =>
          String(
            f.mimeType || ""
          ).includes("pdf")
          ||
          /\.pdf$/i.test(
            f.name
          )
        );

    }


    const results =
      document
        .getElementById(
          "searchResults"
        );


    if(!files.length){

      status(
        voiceMode
        ? "voiceStatus"
        : "searchStatus",

        "❌ कोई file नहीं मिली।"
      );


      results.innerHTML = "";


      if(voiceMode){

        jarvisSpeak(
          "कोई file नहीं मिली।"
        );

      }


      return;

    }


    status(
      voiceMode
      ? "voiceStatus"
      : "searchStatus",

      "✅ " +
      files.length +
      " file मिली।"
    );


    results.innerHTML =
      files
        .map(fileHtml)
        .join("");


    if(voiceMode){

      if(files.length === 1){

        const message =
          files[0].name +
          " file मिल गई है। इसे खोल रहा हूँ।";


        jarvisSpeak(
          message
        );


        setTimeout(
          function(){

            window.open(
              driveLink(
                files[0].id
              ),
              "_blank"
            );

          },
          1200
        );

      }

      else{

        jarvisSpeak(
          files.length +
          " files मिली हैं।"
        );

      }

    }

  }


  catch(error){

    status(
      voiceMode
      ? "voiceStatus"
      : "searchStatus",

      "Search Error: " +
      error.message
    );

  }

}


/* =====================================================
   UPLOAD FILE
===================================================== */

async function uploadFile(){

  const file =
    document
      .getElementById(
        "fileUpload"
      )
      .files[0];


  const folderId =
    folder();


  if(!file){

    status(
      "uploadStatus",
      "पहले कोई file चुनें।"
    );

    return;

  }


  if(!folderId){

    status(
      "uploadStatus",
      "पहले Folder ID डालें।"
    );

    return;

  }


  try{

    const boundary =
      "jarvis_" +
      Date.now();


    const metadata = {

      name:file.name,

      parents:[
        folderId
      ]

    };


    const body =
      new Blob([

        "--" +
        boundary +
        "\r\n",

        "Content-Type: application/json; charset=UTF-8\r\n\r\n",

        JSON.stringify(
          metadata
        ),

        "\r\n--" +
        boundary +
        "\r\n",

        "Content-Type: " +
        (
          file.type ||
          "application/octet-stream"
        ) +
        "\r\n\r\n",

        file,

        "\r\n--" +
        boundary +
        "--"

      ]);


    await driveRequest(

      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",

      {

        method:"POST",

        headers:{

          "Content-Type":
          "multipart/related; boundary=" +
          boundary

        },

        body:body

      }

    );


    document
      .getElementById(
        "fileUpload"
      )
      .value = "";


    status(
      "uploadStatus",
      "File successfully upload हो गई ✅"
    );


    jarvisSpeak(
      "File सफलतापूर्वक upload हो गई।"
    );


    listFiles();

  }


  catch(error){

    status(
      "uploadStatus",
      "Upload Error: " +
      error.message
    );

  }

}


/* =====================================================
   SAVE NOTE
===================================================== */

async function saveNote(){

  const text =
    document
      .getElementById(
        "noteText"
      )
      .value
      .trim();


  const folderId =
    folder();


  if(!text){

    status(
      "noteStatus",
      "पहले note लिखें।"
    );

    return;

  }


  if(!folderId){

    status(
      "noteStatus",
      "पहले Folder ID डालें।"
    );

    return;

  }


  try{

    const boundary =
      "jarvis_note_" +
      Date.now();


    const metadata = {

      name:
      "JARVIS_NOTE_" +
      Date.now() +
      ".txt",

      parents:[
        folderId
      ],

      mimeType:
      "text/plain"

    };


    const body =
      new Blob([

        "--" +
        boundary +
        "\r\n",

        "Content-Type: application/json; charset=UTF-8\r\n\r\n",

        JSON.stringify(
          metadata
        ),

        "\r\n--" +
        boundary +
        "\r\n",

        "Content-Type: text/plain; charset=UTF-8\r\n\r\n",

        text,

        "\r\n--" +
        boundary +
        "--"

      ]);


    await driveRequest(

      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",

      {

        method:"POST",

        headers:{

          "Content-Type":
          "multipart/related; boundary=" +
          boundary

        },

        body:body

      }

    );


    document
      .getElementById(
        "noteText"
      )
      .value = "";


    status(
      "noteStatus",
      "Note Drive में save हो गया ✅"
    );


    jarvisSpeak(
      "आपका note Drive में save हो गया।"
    );


    listFiles();

  }


  catch(error){

    status(
      "noteStatus",
      "Note Error: " +
      error.message
    );

  }

}


/* =====================================================
   VOICE NOTE
===================================================== */

function startVoiceNote(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    status(
      "noteStatus",
      "इस Chrome में Voice Recognition उपलब्ध नहीं है।"
    );

    return;

  }


  const r =
    new SpeechRecognition();


  r.lang =

/* =====================================================
   VOICE JARVIS
===================================================== */

function startVoiceJARVIS(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    status(
      "voiceStatus",
      "इस Chrome में Voice Recognition उपलब्ध नहीं है।"
    );

    return;

  }


  if(recognition){

    try{
      recognition.stop();
    }
    catch(e){}

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "hi-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  const button =
    document
      .getElementById(
        "voiceButton"
      );


  button.classList.add(
    "listening"
  );


  status(
    "voiceStatus",
    "🎤 सुन रहा हूँ... बोलिए।"
  );


  jarvisSpeak(
    "जी, बोलिए।"
  );


  recognition.start();


  recognition.onresult =
  async function(event){

    const text =
      event
        .results[0][0]
        .transcript
        .trim();


    const box =
      document
        .getElementById(
          "lastCommand"
        );


    box.style.display =
      "block";


    box.textContent =
      "🗣️ आपने कहा: " +
      text;


    status(
      "voiceStatus",
      "⏳ समझ रहा हूँ..."
    );


    await handleVoiceCommand(
      text
    );

  };


  recognition.onerror =
  function(event){

    button.classList.remove(
      "listening"
    );


    status(
      "voiceStatus",
      "Voice Error: " +
      event.error
    );


    if(
      event.error ===
      "not-allowed"
    ){

      jarvisSpeak(
        "Microphone की permission दें।"
      );

    }

  };


  recognition.onend =
  function(){

    button.classList.remove(
      "listening"
    );

  };

}


/* =====================================================
   HANDLE VOICE COMMAND
===================================================== */

async function handleVoiceCommand(
  text
){

  const command =
    normalizeText(text);


  const converted =
    convertHindiToEnglish(
      command
    );


  /* ==========================
     NOTE COMMAND
  ========================== */

  if(
    /note|नोट/i.test(
      command
    )
    &&
    /बनाओ|बनाना|लिखो|लिखना|save|बनाएं/i.test(
      command
    )
  ){

    let note =
      command
        .replace(
          /^जार्विस[\s,]*/i,
          ""
        )
        .replace(
          /note|नोट|बनाओ|बनाना|लिखो|लिखना|save|बनाएं/gi,
          ""
        )
        .trim();


    if(note){

      document
        .getElementById(
          "noteText"
        )
        .value =
        note;


      status(
        "voiceStatus",
        "📝 Note तैयार है: " +
        note
      );


      jarvisSpeak(
        "Note तैयार है। Save Note दबाएँ।"
      );

    }

    else{

      jarvisSpeak(
        "बताइए note में क्या लिखना है।"
      );


      startVoiceNote();

    }


    return;

  }


  /* ==========================
     TODAY PHOTO
  ========================== */

  if(
    /आज|today/i.test(
      command
    )
    &&
    /फोटो|photo|image|इमेज/i.test(
      command
    )
  ){

    await searchTodayPhotos();

    return;

  }


  /* ==========================
     FILE SEARCH
  ========================== */

  const term =
    extractSearchTerm(
      command
    );


  if(!term){

    status(
      "voiceStatus",
      "❌ File का नाम समझ नहीं आया।"
    );


    jarvisSpeak(
      "मुझे file का नाम समझ नहीं आया।"
    );


    return;

  }


  document
    .getElementById(
      "searchText"
    )
    .value =
    term;


  await performSearch(
    term,
    true
  );

}


/* =====================================================
   EXTRACT SEARCH TERM
===================================================== */

function extractSearchTerm(
  command
){

  let text =
    normalizeText(
      command
    );


  text =
    text
      .replace(
        /^जार्विस[\s,]*/i,
        ""
      )
      .replace(
        /^jarvis[\s,]*/i,
        ""
      );


  text =
    convertHindiToEnglish(
      text
    );


  text =
    text.replace(

      /\b(
        file|
        files|
        search|
        open|
        show|
        find|
        today|
        photo|
        image|
        video|
        word|
        document|
        pdf|
        excel
      )\b/gi,

      " "

    );


  text =
    text.replace(

      /नाम की|
       नाम का|
       नाम के|
       वाली की|
       वाला की|
       वाले की|
       वाली|
       वाला|
       वाले|
       का|
       की|
       के|
       है|
       हैं|
       मुझे|
       कृपया|
       चाहिए|
       ढूंढो|
       ढूँढो|
       खोजो|
       खोजना|
       खोजें|
       खोलो|
       खोलना|
       खोलें|
       दिखाओ|
       दिखाना/gi,

      " "

    );


  return text
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


/* =====================================================
   TODAY PHOTOS
===================================================== */

async function searchTodayPhotos(){

  try{

    const files =
      await getFolderFiles();


    const start =
      new Date();


    start.setHours(
      0,
      0,
      0,
      0
    );


    const photos =
      files.filter(
        function(file){

          return (

            String(
              file.mimeType || ""
            )
            .startsWith(
              "image/"
            )

            &&

            file.modifiedTime

            &&

            new Date(
              file.modifiedTime
            ) >= start

          );

        }
      );


    document
      .getElementById(
        "searchResults"
      )
      .innerHTML =
      photos
        .map(fileHtml)
        .join("");


    if(photos.length){

      status(
        "voiceStatus",
        "✅ आज की " +
        photos.length +
        " फोटो मिली।"
      );


      jarvisSpeak(
        "आज की " +
        photos.length +
        " फोटो मिली हैं।"
      );

    }

    else{

      status(
        "voiceStatus",
        "❌ आज की कोई फोटो नहीं मिली।"
      );


      jarvisSpeak(
        "आज की कोई फोटो नहीं मिली।"
      );

    }

  }


  catch(error){

    status(
      "voiceStatus",
      "Voice Search Error: " +
      error.message
    );

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  return String(
    text
  ).replace(
    /[&<>"']/g,
    function(character){

      return {

        "&":"&amp;",

        "<":"&lt;",

        ">":"&gt;",

        '"':"&quot;",

        "'":"&#039;"

      }[character];

    }
  );

}
