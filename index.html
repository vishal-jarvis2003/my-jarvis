<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My JARVIS</title>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:900px;
  margin:auto;
  padding:20px;
  background:#f4f7fb;
  color:#172033;
}
h1{text-align:center}
.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccd3df;
  border-radius:8px;
  font-size:15px;
}
button{
  padding:11px 16px;
  margin:5px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  background:#1769e0;
  color:white;
  font-size:14px;
}
button:hover{opacity:.9}
.status{
  margin-top:10px;
  font-weight:bold;
}
.file{
  padding:12px;
  border-bottom:1px solid #eee;
}
.small{
  color:#667085;
  font-size:13px;
}
.error{color:#c62828}
.success{color:#16803c}
</style>
</head>

<body>

<h1>🤖 My JARVIS</h1>

<div class="card">
<h2>1. Google Login</h2>

<input
id="clientId"
type="text"
placeholder="Google OAuth Client ID">

<button onclick="saveClientId()">
Save Client ID
</button>

<button onclick="googleLogin()">
Google Login
</button>

<div id="loginStatus" class="status"></div>
</div>


<div class="card">
<h2>2. JARVIS_DATA</h2>

<input
id="folderId"
type="text"
placeholder="JARVIS_DATA Folder ID">

<button onclick="saveFolderId()">
Save Folder ID
</button>

<button onclick="listFiles()">
Drive में Files देखें
</button>

<div id="fileList"></div>
</div>


<div class="card">
<h2>3. File Upload</h2>

<input id="fileUpload" type="file">

<button onclick="uploadFile()">
JARVIS_DATA में Upload करें
</button>

<div id="uploadStatus" class="status"></div>
</div>


<div class="card">
<h2>4. JARVIS Notes</h2>

<textarea
id="noteText"
rows="6"
placeholder="अपना note यहाँ लिखें..."></textarea>

<button onclick="saveNote()">
Note Drive में Save करें
</button>

<div id="noteStatus" class="status"></div>
</div>


<script src="https://accounts.google.com/gsi/client"></script>

<script>

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive";

let accessToken = null;
let tokenClient = null;


/* =========================
   PAGE LOAD
========================= */

window.addEventListener("load", function(){

document.getElementById("clientId").value =
localStorage.getItem("jarvisClientId") || "";

document.getElementById("folderId").value =
localStorage.getItem("jarvisFolderId") || "";

});


/* =========================
   SAVE CLIENT ID
========================= */

function saveClientId(){

const clientId =
document.getElementById("clientId").value.trim();

if(!clientId){

document.getElementById("loginStatus").textContent =
"पहले Client ID डालें।";

return;
}

localStorage.setItem(
"jarvisClientId",
clientId
);

document.getElementById("loginStatus").textContent =
"Client ID save हो गया ✅";

}


/* =========================
   SAVE FOLDER ID
========================= */

function saveFolderId(){

const folderId =
document.getElementById("folderId").value.trim();

if(!folderId){

document.getElementById("fileList").textContent =
"पहले Folder ID डालें।";

return;
}

localStorage.setItem(
"jarvisFolderId",
folderId
);

document.getElementById("loginStatus").textContent =
"JARVIS_DATA Folder ID save हो गई ✅";

}


/* =========================
   GOOGLE LOGIN
========================= */

function googleLogin(){

const clientId =
document.getElementById("clientId").value.trim();

if(!clientId){

document.getElementById("loginStatus").textContent =
"पहले Google OAuth Client ID डालें।";

return;
}

if(!window.google){

document.getElementById("loginStatus").textContent =
"Google Login load हो रहा है। थोड़ी देर बाद फिर दबाएँ।";

return;
}


tokenClient =
google.accounts.oauth2.initTokenClient({

client_id:clientId,

scope:DRIVE_SCOPE,

callback:function(response){

if(response.error){

document.getElementById("loginStatus").innerHTML =
'<span class="error">Login Error: ' +
escapeHtml(response.error) +
"</span>";

return;
}

accessToken =
response.access_token;

document.getElementById("loginStatus").innerHTML =
'<span class="success">Google Login सफल ✅</span>';

}

});


tokenClient.requestAccessToken({
prompt:"consent"
});

}


/* =========================
   DRIVE REQUEST
========================= */

async function driveRequest(url,options={}){

if(!accessToken){

throw new Error(
"पहले Google Login करें।"
);

}

options.headers = Object.assign({

"Authorization":
"Bearer "+accessToken

},options.headers || {});


const response =
await fetch(url,options);


if(!response.ok){

const text =
await response.text();

throw new Error(
"Google Drive Error: "+text
);

}

return response;

}


/* =========================
   LIST FILES
========================= */

async function listFiles(){

const list =
document.getElementById("fileList");

try{

const folderId =
document.getElementById("folderId")
.value.trim();


if(!folderId){

list.textContent =
"पहले JARVIS_DATA Folder ID डालें।";

return;
}


if(!accessToken){

list.textContent =
"पहले Google Login करें।";

return;
}


list.textContent =
"Files लोड हो रही हैं...";


const query =
"'" +
folderId +
"' in parents and trashed=false";


const params =
new URLSearchParams({

q:query,

fields:
"files(id,name,mimeType,modifiedTime,webViewLink)",

pageSize:"100",

orderBy:"name"

});


const url =
"https://www.googleapis.com/drive/v3/files?"
+params.toString();


const response =
await driveRequest(url);


const data =
await response.json();


if(!data.files || data.files.length===0){

list.innerHTML =
"<p>JARVIS_DATA folder खाली है।</p>";

return;
}


list.innerHTML =
data.files.map(function(file){

let link = "";

if(file.webViewLink){

link =
`<br><a href="${escapeHtml(file.webViewLink)}"
target="_blank">Drive में खोलें</a>`;
}

return `
<div class="file">

<b>${escapeHtml(file.name)}</b>

<br>

<span class="small">
${escapeHtml(file.mimeType)}
</span>

${link}

</div>
`;

}).join("");


}

catch(error){

list.innerHTML =
'<span class="error">Error: ' +
escapeHtml(error.message) +
"</span>";

}

}


/* =========================
   UPLOAD FILE
========================= */

async function uploadFile(){

const status =
document.getElementById("uploadStatus");

const file =
document.getElementById("fileUpload").files[0];

const folderId =
document.getElementById("folderId")
.value.trim();


if(!accessToken){

status.textContent =
"पहले Google Login करें।";

return;
}


if(!file){

status.textContent =
"पहले कोई file चुनें।";

return;
}


if(!folderId){

status.textContent =
"पहले JARVIS_DATA Folder ID डालें।";

return;
}


try{

status.textContent =
"File upload हो रही है...";


const metadata = {

name:file.name,

parents:[folderId]

};


const boundary =
"----JARVISBoundary" +
Date.now();


const body =
new Blob([

"--"+boundary+"\r\n"+

"Content-Type: application/json; charset=UTF-8\r\n\r\n"+

JSON.stringify(metadata)+

"\r\n--"+boundary+"\r\n"+

"Content-Type: "+
(file.type || "application/octet-stream")+
"\r\n\r\n",

file,

"\r\n--"+boundary+"--"

]);


await driveRequest(

"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",

{

method:"POST",

headers:{

"Content-Type":
"multipart/related; boundary="+boundary

},

body:body

}

);


status.innerHTML =
'<span class="success">File successfully upload हो गई ✅</span>';

document.getElementById("fileUpload").value="";

listFiles();

}

catch(error){

status.innerHTML =
'<span class="error">Upload Error: '+
escapeHtml(error.message)+
"</span>";

}

}


/* =========================
   SAVE NOTE
========================= */

async function saveNote(){

const status =
document.getElementById("noteStatus");

const text =
document.getElementById("noteText")
.value.trim();

const folderId =
document.getElementById("folderId")
.value.trim();


if(!accessToken){

status.textContent =
"पहले Google Login करें।";

return;
}


if(!text){

status.textContent =
"पहले note लिखें।";

return;
}


if(!folderId){

status.textContent =
"पहले Folder ID डालें।";

return;
}


try{

status.textContent =
"Note save हो रहा है...";


const metadata = {

name:
"JARVIS_NOTE_"+
Date.now()+
".txt",

parents:[folderId],

mimeType:"text/plain"

};


const boundary =
"----JARVISNoteBoundary"+
Date.now();


const body =
new Blob([

"--"+boundary+"\r\n"+

"Content-Type: application/json; charset=UTF-8\r\n\r\n"+

JSON.stringify(metadata)+

"\r\n--"+boundary+"\r\n"+

"Content-Type: text/plain; charset=UTF-8\r\n\r\n",

text,

"\r\n--"+boundary+"--"

]);


await driveRequest(

"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",

{

method:"POST",

headers:{

"Content-Type":
"multipart/related; boundary="+boundary

},

body:body

}

);


document.getElementById("noteText").value="";

status.innerHTML =
'<span class="success">Note Drive में save हो गया ✅</span>';

listFiles();

}

catch(error){

status.innerHTML =
'<span class="error">Note Error: '+
escapeHtml(error.message)+
"</span>";

}

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text){

return String(text).replace(
/[&<>"']/g,
function(ch){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[ch];

});

}

</script>

</body>
</html>
